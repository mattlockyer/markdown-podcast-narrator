[project]
name = "markdown-podcast-narrator"
version = "0.1.0"
description = "Convert Markdown documents to podcast-style audio using local TTS"
license = {file = "LICENSE"}
requires-python = ">=3.10"

dependencies = [
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "click>=8.1.0",
    "InquirerPy>=0.3.4",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
qwen = [
    "qwen-tts",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]
kokoro = [
    "mlx-audio>=0.4.4",
    "misaki[en]",
]
chatterbox = [
    "mlx-audio>=0.4.4",
]

# qwen-tts pins transformers==4.57.3, but mlx-audio (kokoro/chatterbox)
# needs transformers>=5.5.0 — so the qwen engine can't share a resolution
# universe with the MLX engines. Declare them mutually exclusive; pick the
# engine's extra at install time (mdpod.sh uses --extra kokoro).
[tool.uv]
conflicts = [
    [{ extra = "qwen" }, { extra = "kokoro" }],
    [{ extra = "qwen" }, { extra = "chatterbox" }],
]

[tool.setuptools]
py-modules = ["main", "cli", "parser", "narrator"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
